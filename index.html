<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIOLA — Tattoo & Art</title>

  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }

    body {

      background: #050505;

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;

    }

    .hero {

      width: 100vw;

      height: 100vh;

      position: relative;

      display: flex;

    }

    .logo {

      position: absolute;

      z-index: 20;

      top: 35px;

      left: 50%;

      transform: translateX(-50%);

      text-align: center;

      pointer-events: none;

    }

    .logo h1 {

      font-size: clamp(38px, 6vw, 80px);

      font-weight: 300;

      letter-spacing: 14px;

    }

    .logo p {

      margin-top: 8px;

      font-size: 11px;

      letter-spacing: 5px;

      opacity: 0.7;

    }

    .side {

      position: relative;

      width: 50%;

      height: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      text-decoration: none;

      color: white;

      overflow: hidden;

      transition: width 0.7s ease;

    }

    .side::before {

      content: "";

      position: absolute;

      inset: 0;

      transition: transform 0.8s ease, opacity 0.8s ease;

    }

    .tattoo::before {

      background:

        radial-gradient(circle at 50% 45%, rgba(255,255,255,.12), transparent 30%),

        linear-gradient(135deg, #050505, #191919);

    }

    .art::before {

      background:

        radial-gradient(circle at 50% 45%, rgba(255,255,255,.16), transparent 28%),

        linear-gradient(135deg, #1a0710, #080808);

    }

    .side::after {

      content: "";

      position: absolute;

      inset: 0;

      background: rgba(0,0,0,.25);

      transition: background .5s ease;

    }

    .content {

      position: relative;

      z-index: 5;

      text-align: center;

      transition: transform .6s ease;

    }

    .content .number {

      font-size: 12px;

      letter-spacing: 4px;

      opacity: .5;

      margin-bottom: 20px;

    }

    .content h2 {

      font-family: Georgia, serif;

      font-size: clamp(55px, 9vw, 130px);

      font-weight: normal;

      letter-spacing: 4px;

    }

    .content p {

      margin-top: 22px;

      letter-spacing: 4px;

      font-size: 11px;

      opacity: .65;

    }

    .enter {

      display: inline-block;

      margin-top: 35px;

      border: 1px solid rgba(255,255,255,.5);

      padding: 13px 25px;

      font-size: 10px;

      letter-spacing: 4px;

      transition: .4s;

    }

    .divider {

      position: absolute;

      left: 50%;

      top: 0;

      width: 1px;

      height: 100%;

      background: rgba(255,255,255,.22);

      z-index: 10;

    }

    .side:hover::before {

      transform: scale(1.05);

    }

    .side:hover::after {

      background: rgba(0,0,0,.05);

    }

    .side:hover .content {

      transform: translateY(-10px);

    }

    .side:hover .enter {

      background: white;

      color: black;

    }

    .footer {

      position: absolute;

      z-index: 30;

      bottom: 23px;

      width: 100%;

      text-align: center;

      font-size: 9px;

      letter-spacing: 3px;

      opacity: .5;

      pointer-events: none;

    }

    @media (max-width: 700px) {

      .hero {

        flex-direction: column;

      }

      .side {

        width: 100%;

        height: 50%;

      }

      .divider {

        left: 0;

        top: 50%;

        width: 100%;

        height: 1px;

      }

      .logo {

        top: 50%;

        transform: translate(-50%, -50%);

        background: #050505;

        padding: 12px 20px;

      }

      .logo h1 {

        font-size: 22px;

        letter-spacing: 8px;

      }

      .logo p {

        display: none;

      }

      .content h2 {

        font-size: 52px;

      }

      .content p {

        margin-top: 10px;

      }

      .enter {

        margin-top: 16px;

      }

    }

  </style>

</head>

<body>

  <main class="hero">

    <div class="logo">

      <h1>VIOLA</h1>

      <p>TATTOO ARTIST · PAINTER</p>

    </div>

    <a class="side tattoo" href="tattoo.html">

      <div class="content">

        <div class="number">01</div>

        <h2>TATTOO</h2>

        <p>INK · REALISM · DESIGN</p>

        <span class="enter">ENTER</span>

      </div>

    </a>

    <a class="side art" href="art.html">

      <div class="content">

        <div class="number">02</div>

        <h2>ART</h2>

        <p>PAINTINGS · ORIGINAL WORKS</p>

        <span class="enter">ENTER</span>

      </div>

    </a>

    <div class="divider"></div>

    <div class="footer">

      VIOLA © 2026

    </div>

  </main>

</body>

</html>
